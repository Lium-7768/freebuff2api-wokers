services:
  freebuff2api:
    build: .
    image: freebuff2api:local
    container_name: freebuff2api
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=8877
      - HOST=127.0.0.1
      # 上游地址：默认空=直连官方 www.codebuff.com
      - CODEBUFF_API=
      - FREEBUFF_API_KEY=${FREEBUFF_API_KEY:?FREEBUFF_API_KEY is required}
      - FREEBUFF_CREDENTIALS_JSON=${FREEBUFF_CREDENTIALS_JSON:?FREEBUFF_CREDENTIALS_JSON is required}
      - FREEBUFF_DEBUG=false
    volumes:
      - ./credentials:/app/credentials:ro
