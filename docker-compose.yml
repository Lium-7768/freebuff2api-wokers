services:
  freebuff2api:
    build: .
    image: freebuff2api:local
    container_name: freebuff2api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8877:8787"
    environment:
      - PORT=8787
      - HOST=0.0.0.0
      # 上游地址：默认空=直连官方 www.codebuff.com
      - CODEBUFF_API=
      - FREEBUFF_API_KEY=${FREEBUFF_API_KEY:?FREEBUFF_API_KEY is required}
      - FREEBUFF_TOKEN=${FREEBUFF_TOKEN:-}
      - FREEBUFF_DEBUG=false
    volumes:
      - ./credentials:/app/credentials:ro
